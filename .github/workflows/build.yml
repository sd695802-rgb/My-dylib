name: Build iOS Dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Compile Dylib
      run: |
        xcrun --sdk iphoneos clang -dynamiclib -arch arm64 -framework Foundation -framework UIKit main.m -o mylib.dylib

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: iOS-Dylib
        path: mylib.dylib
